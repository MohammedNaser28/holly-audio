# Crates:
#   holly-proto  — pure framing/parsing (no I/O), unit-tested against observed behavior
#   holly-usb    — device I/O (nusb): transport + certified SET/GET ops
#   holly-cli    — clap CLI on top of holly-usb: status / nc / watch
#   holly-app    — UI-agnostic device actor + Snapshot/ViewModel (std threads only)
#   frontends/*  — UI shells ONLY, each in its own workspace (see Task 8 of the
#                  current prompt); excluded below so root `cargo test` never
#                  compiles their (large) toolkits.
[workspace]
resolver = "2"
members = ["holly-proto", "holly-usb", "holly-cli", "holly-app"]
exclude = ["frontends"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.release]
# Desktop control-plane crate: small binaries, fast startup.
lto = "thin"
