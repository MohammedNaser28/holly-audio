name: Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            libudev-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            pkg-config

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-cargo-
            ${{ runner.os }}-cargo-

      - name: Build release binaries
        run: cargo +stable build --locked --release -p holly-cli -p holly-gpui

      - name: Package Linux release
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          package="holly-audio-${VERSION}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/${package}"
          install -m 0755 target/release/holly "dist/${package}/holly"
          install -m 0755 target/release/holly-gpui "dist/${package}/holly-gpui"
          install -m 0644 packaging/70-hollyland.rules "dist/${package}/70-hollyland.rules"
          install -m 0755 install.sh "dist/${package}/install.sh"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          sha256sum "dist/${package}.tar.gz" > "dist/${package}.tar.gz.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "${VERSION}" \
            dist/*.tar.gz \
            dist/*.sha256 \
            --title "Holly Audio ${VERSION}" \
            --generate-notes
