<html lang="en">
<head>

<title>Holly window reference</title>
<style>
@font-face{font-family:'Hanken Grotesk';font-style:normal;font-weight:300;font-display:swap;src:url('fonts/hanken-grotesk-latin-300-normal.woff2') format('woff2')}
@font-face{font-family:'Hanken Grotesk';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/hanken-grotesk-latin-400-normal.woff2') format('woff2')}

@font-face{font-family:'Hanken Grotesk';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/hanken-grotesk-latin-600-normal.woff2') format('woff2')}

body{margin:0;background:#0F1114}
button:focus-visible{outline:2px solid #FFB547;outline-offset:3px}
@keyframes holly-pulse{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

html{background:#08090A}
body{margin:0;padding:24px;background:#08090A;font-family:'Hanken Grotesk',system-ui,sans-serif}
.ref-bar{display:flex;gap:16px;align-items:center;margin:0 0 16px;font-size:13px;color:#A3AAB4}
.ref-bar a{color:#A3AAB4;text-decoration:none;padding:6px 10px;border-radius:6px;border:1px solid #2A2E35}
.ref-bar a[aria-current=page]{color:#1A1205;background:#FFB547;border-color:#FFB547}
</style>
</head>
<body>
<nav class="ref-bar" aria-label="Reference states"><span>Holly window reference. State:</span><a data-mode-link="connected" href="?mode=connected">connected</a><a data-mode-link="pending" href="?mode=pending">pending</a><a data-mode-link="busy" href="?mode=busy">busy</a><a href="tokens.html">tokens</a></nav>
<div id="root" style="display:inline-block"></div>
<template id="tpl"><div style="width:1080px;height:760px;box-sizing:border-box;display:flex;flex-direction:column;background:linear-gradient(180deg,#15181C 0%,#0F1114 100%);border:1px solid #2A2E35;border-radius:12px;overflow:hidden;font-family:'Hanken Grotesk',system-ui,sans-serif;color:#ECEEF1">

<div style="height:44px;flex:none;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid #22262C">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="10" stroke="#ECEEF1" stroke-width="1.6"/><circle cx="12" cy="12" r="4" fill="#FFB547"/></svg>
<span style="font-size:14px;font-weight:600">Holly</span>
<span style="width:1px;height:16px;background:#2A2E35"></span>
<span style="font-size:14px;color:#A3AAB4">Lark A1</span>
</div>

<sc-if value="{{busy}}" hint-placeholder-val="{{false}}">
<div role="alert" style="flex:none;display:flex;align-items:center;gap:14px;padding:12px 20px;background:#221C12;border-bottom:1px solid #3A2E18">

<div style="display:flex;flex-direction:column;gap:2px">
<span style="font-size:14px;font-weight:600">Another app is using the receiver</span>
<span style="font-size:13px;color:#C9B38A">Close holly-cli or any other Holly window, then try again.</span>
</div>
<button type="button" style="margin-left:auto;height:36px;padding:0 16px;border-radius:8px;border:1px solid #3A3F47;background:#262A30;color:#ECEEF1;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.07)">Try again</button>
</div>
</sc-if>

<div style="flex:1;min-height:0;display:flex;gap:16px;padding:20px">

<div style="width:336px;flex:none;display:flex;flex-direction:column;gap:16px">
<sc-for list="{{mics}}" as="m" hint-placeholder-count="2">
<div style="flex:1;min-height:0;display:flex;flex-direction:column;gap:18px;padding:20px;box-sizing:border-box;border-radius:14px;border:1px solid #262A30;background:linear-gradient(180deg,#1C1F24 0%,#15171B 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 1px 0 rgba(0,0,0,.5)">
<div style="display:flex;align-items:center;gap:12px">
<div style="width:32px;height:32px;border-radius:50%;background:#0B0C0E;box-shadow:inset 0 1px 3px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{m.icon}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>

</div>
</div>

<div style="display:flex;flex-direction:column;gap:16px;min-height:0;opacity:{{dim}}">
<div style="flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:20px;box-sizing:border-box;border-radius:14px;border:1px solid #262A30;background:linear-gradient(180deg,#1C1F24 0%,#15171B 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 1px 0 rgba(0,0,0,.5)">

<div style="flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:20px;box-sizing:border-box;border-radius:14px;border:1px solid #262A30;background:linear-gradient(180deg,#1C1F24 0%,#15171B 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 1px 0 rgba(0,0,0,.5)">

</sc-for>

<button type="button" role="radio" aria-checked="{{o.checked}}" disabled="{{allOff}}" style="position:relative;flex:1;min-width:0;height:36px;border:0;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13px;background:{{o.bg}};color:{{o.color}};font-weight:{{o.weight}};box-shadow:{{o.shadow}}">{{o.label}}<sc-if value="{{o.selected}}" hint-placeholder-val="{{false}}"><span style="position:absolute;left:50%;bottom:4px;width:14px;height:2px;margin-left:-7px;border-radius:1px;background:#FFB547;box-shadow:{{o.glow}}"></span></sc-if></button>

<div style="display:flex;flex-direction:column;gap:16px;min-height:0;opacity:{{dim}}">
<div style="flex:1;min-height:0;display:flex;align-items:center;justify-content:space-between;padding:0 20px;box-sizing:border-box;border-radius:14px;border:1px solid #262A30;background:linear-gradient(180deg,#1C1F24 0%,#15171B 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 1px 0 rgba(0,0,0,.5)">

<button type="button" role="switch" aria-checked="{{recogTog.checked}}" aria-label="Mic recognition" disabled="{{allOff}}" style="position:relative;width:48px;height:26px;padding:0;border:0;border-radius:13px;cursor:pointer;{{recogTog.track}}"><span style="position:absolute;top:3px;left:{{recogTog.left}}px;width:20px;height:20px;border-radius:50%;background:{{recogTog.thumb}};box-shadow:0 1px 2px rgba(0,0,0,.5)"></span></button>
</div>

</div>
</div>

</div>
</div>

<span>{{footText}}</span>
<span style="margin-left:auto;font-variant-numeric:tabular-nums">3547:0407</span>
</div>

<script>
class DCLogic { constructor(props) { this.props = props || {}; this.state = {}; } }
</script>
<script>

class Component extends DCLogic {
  renderVals() {
    const mode = this.props.mode ?? 'connected';
    const busy = mode === 'busy';
    const pending = mode === 'pending';
    const live = !busy;

    const seg = (n, on, color, peakFrom, peakColor) => Array.from({ length: n }, (_, i) => ({
      bg: i < on ? (peakFrom !== undefined && i >= peakFrom ? peakColor : color) : '#262A30'
    }));
    const opts = (labels, sel, glow) => labels.map((label, i) => {
      const on = i === sel;
      return {
        label,
        selected: on,
        checked: on ? 'true' : 'false',
        bg: on ? 'linear-gradient(180deg,#2B2F36 0%,#22252B 100%)' : 'transparent',
        color: on ? '#ECEEF1' : '#A3AAB4',
        weight: on ? 600 : 500,
        shadow: on ? 'inset 0 1px 0 rgba(255,255,255,.08),0 1px 0 #000' : 'none',
        glow: glow ? '0 0 6px rgba(255,181,71,.6)' : 'none'
      };
    });
    const tog = (on) => ({
      checked: on ? 'true' : 'false',
      track: on
        ? 'background:linear-gradient(180deg,#FFC66E 0%,#F5A524 100%);box-shadow:inset 0 1px 2px rgba(0,0,0,.25)'
        : 'background:#0A0B0D;box-shadow:inset 0 2px 6px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.06)',
      left: on ? 25 : 3,
      thumb: on ? 'linear-gradient(180deg,#ECEEF1,#C9CED6)' : 'linear-gradient(180deg,#A3AAB4,#8A919B)'
    });

    const green = 'background:#5FD38D;box-shadow:0 0 8px rgba(95,211,141,.7)';
    const amber = 'background:#FFB547;box-shadow:0 0 8px rgba(255,181,71,.7)';
    const ring = 'border:1.5px solid #5A616B';

    const mics = [
      { name: 'Mic 1', meterOn: 11 },
      { name: 'Mic 2', meterOn: 7 }
    ].map((m) => ({
      name: m.name,
      status: live ? 'Connected' : 'No data',
      led: live ? green : ring,
      icon: live ? '#ECEEF1' : '#7F8793',
      battery: live ? '100' : '--',
      numColor: live ? '#ECEEF1' : '#4A5059',
      bat: seg(5, live ? 5 : 0, '#ECEEF1'),
      meter: seg(20, live ? m.meterOn : 0, '#A3AAB4', 17, '#FFB547')
    }));

    const litBase = 'background:linear-gradient(180deg,#FFC66E 0%,#F5A524 100%);color:#1A1205;';
    const matte = 'background:linear-gradient(180deg,#2B2F36 0%,#22252B 100%);color:#A3AAB4;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 2px 0 #0B0C0E';
    const onPad = busy
      ? matte
      : pending
        ? litBase + 'opacity:.4;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 0 rgba(0,0,0,.15)'
        : litBase + 'box-shadow:0 0 32px rgba(255,181,71,.35),inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 0 rgba(0,0,0,.15)';

    const nc = {
      led: busy ? ring : amber + (pending ? ';animation:holly-pulse 1.1s ease-in-out infinite' : ''),
      status: busy ? 'Unavailable' : pending ? 'Applying' : 'On',
      checked: busy ? 'false' : 'true',
      onPad,
      levelOpacity: busy ? 0.6 : pending ? 0.5 : 1
    };

    const none = -1;
    const glowOn = !pending;
    return {
      busy,
      live,
      allOff: busy,
      ncOff: busy || pending,
      dim: busy ? 0.6 : 1,
      mics,
      nc,
      ncLevels: opts(['Weak', 'Medium', 'Strong'], busy ? none : 1, glowOn),
      volume: opts(['1', '2', '3', '4', '5', '6'], busy ? none : 3, true),
      channel: opts(['Mono', 'Stereo'], busy ? none : 1, true),
      eq: opts(['Equalization', 'Low', 'Bright'], busy ? none : 0, true),
      reverbSize: opts(['Small', 'Medium', 'Large'], busy ? none : 2, true),
      schedule: opts(['15min', 'Never'], busy ? none : 0, true),
      reverbOn: live,
      reverbTog: tog(live),
      recogTog: tog(live),
      lightTog: tog(live),
      footLed: busy ? amber : green,
      footText: busy ? 'Receiver in use' : 'Receiver connected'
    };
  }
}

</script>
<script>

function resolve(path, scope) {
  const p = path.trim();
  if (p === 'true') return true;
  if (p === 'false') return false;
  const parts = p.split('.');
  let v = scope[parts[0]];
  for (let i = 1; i < parts.length && v != null; i++) v = v[parts[i]];
  return v;
}
const HOLE = /\{\{([^}]+)\}\}/g;
function interp(s, scope) {
  return s.replace(HOLE, (_, p) => { const v = resolve(p, scope); return v == null ? '' : String(v); });
}
function whole(s) { const m = s.match(/^\s*\{\{([^}]+)\}\}\s*$/); return m ? m[1] : null; }
function raw(node, name, scope) {
  const s = node.getAttribute(name);
  if (s == null) return undefined;
  const w = whole(s);
  return w !== null ? resolve(w, scope) : interp(s, scope);
}
function render(node, scope, out) {
  if (node.nodeType === 3) { out.appendChild(document.createTextNode(interp(node.nodeValue, scope))); return; }
  if (node.nodeType !== 1) return;
  const tag = node.tagName.toLowerCase();
  if (tag === 'sc-for') {
    const list = raw(node, 'list', scope) || [];
    const as = node.getAttribute('as');
    list.forEach((item, i) => {
      const s = Object.assign({}, scope, { [as]: item, $index: i });
      node.childNodes.forEach((c) => render(c, s, out));
    });
    return;
  }
  if (tag === 'sc-if') {
    if (raw(node, 'value', scope)) node.childNodes.forEach((c) => render(c, scope, out));
    return;
  }
  const el = node.cloneNode(false);
  Array.from(el.attributes).forEach((a) => el.removeAttribute(a.name));
  Array.from(node.attributes).forEach((a) => {
    if (a.name.startsWith('hint-')) return;
    const w = whole(a.value);
    if (w !== null) {
      const v = resolve(w, scope);
      if (v === false || v == null) return;
      el.setAttribute(a.name, v === true && !a.name.startsWith('aria-') ? '' : String(v));
    } else {
      el.setAttribute(a.name, interp(a.value, scope));
    }
  });
  node.childNodes.forEach((c) => render(c, scope, el));
  out.appendChild(el);
}
const params = new URLSearchParams(location.search);
const props = {};
if (params.get('mode')) props.mode = params.get('mode');
const vals = new Component(props).renderVals();
const tpl = document.getElementById('tpl').content;
const root = document.getElementById('root');
tpl.childNodes.forEach((c) => render(c, vals, root));
document.querySelectorAll('[data-mode-link]').forEach((a) => {
  if ((params.get('mode') || 'connected') === a.dataset.modeLink) a.setAttribute('aria-current', 'page');
});

</script>
