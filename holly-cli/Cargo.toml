[package]
name = "holly-cli"
version.workspace = true
edition.workspace = true
description = "CLI for the Hollyland 6108 dongle: status, noise-cancel, change watch"

[[bin]]
name = "holly"
path = "src/main.rs"

[dependencies]
holly-usb = { path = "../holly-usb" }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = "3.4"
